[package]
name = "link-camera"
version = "0.6.1"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"
description = "Local Insta360 Link camera controller for Linux, with Slint GUI and CLI"

[features]
default = ["gui"]
gui = ["dep:slint", "dep:slint-build"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
insta360-link = { git = "https://github.com/sglre6355/insta360-link", rev = "389e5a7ba028cc45f4277bafd1faa55a5cd12ea2", features = ["serde"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2", "accessibility"] }

ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs", "api-31"] }
sha2 = "0.10"
[build-dependencies]
slint-build = { version = "=1.18.1", optional = true }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = "debuginfo"
